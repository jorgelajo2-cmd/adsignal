# adsignal: atiende las solicitudes y publica la web
#
# Cada 15 minutos (o al pulsar "Run workflow" en la pestaña Actions):
#   1. procesa las solicitudes pendientes de la hoja → genera informes → envía emails
#   2. guarda los informes nuevos en el repositorio
#   3. publica la carpeta web/ en GitHub Pages (landing + informes)
# También publica la web cuando subes cambios a web/.
#
# Secretos necesarios (Settings → Secrets and variables → Actions):
#   GOOGLE_SA_JSON, SHEET_ID, BREVO_API_KEY, REMITENTE_EMAIL, BASE_URL
# Opcionales: BREVO_LISTA_ID, META_TOKEN, ANTHROPIC_API_KEY

name: adsignal

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["web/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: adsignal
  cancel-in-progress: false

jobs:
  procesar-y-publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Procesar solicitudes pendientes
        if: github.event_name != 'push'
        env:
          PYTHONIOENCODING: utf-8
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          REMITENTE_EMAIL: ${{ secrets.REMITENTE_EMAIL }}
          BREVO_LISTA_ID: ${{ secrets.BREVO_LISTA_ID }}
          BASE_URL: ${{ secrets.BASE_URL }}
          META_TOKEN: ${{ secrets.META_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m motor.procesar

      - name: Guardar informes nuevos en el repositorio
        id: guardar
        run: |
          git config user.name "adsignal-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/informes
          if git diff --cached --quiet; then
            echo "nuevos=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Informes nuevos"
            git push
            echo "nuevos=true" >> "$GITHUB_OUTPUT"
          fi

      # Solo se vuelve a publicar si hay informes nuevos, cambios en la web o ejecución manual
      - if: steps.guardar.outputs.nuevos == 'true' || github.event_name != 'schedule'
        uses: actions/configure-pages@v5

      - if: steps.guardar.outputs.nuevos == 'true' || github.event_name != 'schedule'
        uses: actions/upload-pages-artifact@v4
        with:
          path: web

      - if: steps.guardar.outputs.nuevos == 'true' || github.event_name != 'schedule'
        id: despliegue
        uses: actions/deploy-pages@v4
