# adsignal: atiende las solicitudes y publica la web
#
# De forma programada (o al pulsar "Run workflow" en la pestaña Actions):
#   1. genera los informes de las solicitudes pendientes de la hoja
#   2. los guarda en el repositorio
#   3. publica la carpeta web/ en GitHub Pages (landing + informes)
#   4. envía los emails, ya con el enlace funcionando
# También publica la web cuando subes cambios a web/.
#
# Secretos necesarios (Settings → Secrets and variables → Actions):
#   GOOGLE_SA_JSON, SHEET_ID, BREVO_API_KEY, REMITENTE_EMAIL, BASE_URL
# Opcionales: BREVO_LISTA_ID, META_TOKEN, ANTHROPIC_API_KEY
# Variable opcional (pestaña Variables): META_API_VERSION

name: adsignal

on:
  schedule:
    # GitHub no garantiza la puntualidad: en la práctica puede tardar más de una hora
    - cron: "*/15 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["web/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: adsignal
  cancel-in-progress: false

env:
  PYTHONIOENCODING: utf-8
  # Las credenciales van en cada paso que las necesita, no aquí

jobs:
  procesar-y-publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Generar los informes pendientes
        id: generar
        if: github.event_name != 'push'
        env:
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          REMITENTE_EMAIL: ${{ secrets.REMITENTE_EMAIL }}
          BREVO_LISTA_ID: ${{ secrets.BREVO_LISTA_ID }}
          BASE_URL: ${{ secrets.BASE_URL }}
          META_TOKEN: ${{ secrets.META_TOKEN }}
          META_API_VERSION: ${{ vars.META_API_VERSION }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m motor.procesar generar

      - name: Guardar informes nuevos en el repositorio
        id: guardar
        run: |
          git config user.name "adsignal-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/informes
          if git diff --cached --quiet; then
            echo "nuevos=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Informes nuevos"
            git pull --rebase
            git push
            echo "nuevos=true" >> "$GITHUB_OUTPUT"
          fi

      # Se publica si hay informes nuevos o por enviar, cambios en la web o ejecución manual
      - id: decidir
        run: echo "publicar=${{ steps.guardar.outputs.nuevos == 'true' || (steps.generar.outputs.por_enviar != '' && steps.generar.outputs.por_enviar != '0') || github.event_name != 'schedule' }}" >> "$GITHUB_OUTPUT"

      - if: steps.decidir.outputs.publicar == 'true'
        uses: actions/configure-pages@v5

      - if: steps.decidir.outputs.publicar == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: web

      - if: steps.decidir.outputs.publicar == 'true'
        id: despliegue
        uses: actions/deploy-pages@v4

      - name: Enviar los informes ya publicados
        id: enviar
        if: github.event_name != 'push'
        env:
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          REMITENTE_EMAIL: ${{ secrets.REMITENTE_EMAIL }}
          BASE_URL: ${{ secrets.BASE_URL }}
        run: python -m motor.procesar enviar

      # Marca la ejecución en rojo (GitHub avisa por email) sin frenar al resto de solicitudes
      - name: Avisar si algo necesita revisión
        if: github.event_name != 'push' && (steps.generar.outputs.problemas != '0' || steps.enviar.outputs.problemas != '0')
        run: |
          echo "::error::Hay solicitudes con problemas. Mira la columna 'error' de la hoja y el registro de los pasos de generar y enviar."
          exit 1
